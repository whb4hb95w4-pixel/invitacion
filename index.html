<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para ti...</title>
    <style>
        /* Estilos base */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff; /* Fondo blanco */
            color: #16a34a; /* Color de texto Verde Esmeralda */
            text-align: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            max-width: 90%;
            width: 350px;
            background: white;
            padding: 2.5rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(22, 163, 74, 0.1);
            transition: opacity 1s ease-in-out;
        }

        /* Pantalla de Inicio (Intro) */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        .intro-img {
            max-width: 70%;
            height: auto;
            border-radius: 20px;
        }

        .hidden { display: none !important; }
        .fade-out { opacity: 0; visibility: hidden; }

        /* Imágenes de eventos */
        .event-img {
            max-width: 100%;
            height: auto;
            max-height: 200px;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            object-fit: cover;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            color: #16a34a; /* Título Verde */
            line-height: 1.3;
        }

        p { font-size: 1.1rem; color: #15803d; }

        /* Botones */
        .buttons-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            height: 60px;
            margin-top: 1rem;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .yes {
            background-color: #16a34a; /* Botón Sí Verde */
            color: white;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
            z-index: 10;
        }

        .no {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            z-index: 5;
            transition: top 0.2s ease-out, left 0.2s ease-out;
        }

        .hint {
            font-size: 0.9rem;
            color: #166534;
            font-style: italic;
            margin-bottom: 1.5rem;
        }

        /* Selección de días */
        .days-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-btn {
            padding: 14px;
            border: 2px solid #16a34a;
            background: white;
            color: #16a34a;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-btn:active {
            background: #16a34a;
            color: white;
        }

        .preferred {
            background-color: #f0fdf4;
            border: 2px solid #15803d;
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <img src="bicho5.jpg" alt="Cargando..." class="intro-img">
    </div>

    <div id="step1" class="container">
        <img src="foto1.jpg" alt="Pregunta" class="event-img">
        <h1>¿Quieres quedar a comer conmigo esta semana?</h1>
        <div class="buttons-wrapper">
            <button id="btn-yes" class="btn yes">¡Sí!</button>
            <button id="btn-no" class="btn no">No</button>
        </div>
    </div>

    <div id="step2" class="container hidden">
        <img src="foto2.jpg" alt="Alegría" class="event-img">
        <h1>¡Qué alegría! 🌿</h1>
        <p>¿Qué día te viene mejor?</p>
        <p class="hint">(Si te soy sincero, prefiero el miércoles o el jueves 😉)</p>
        <div class="days-grid">
            <button class="day-btn preferred" onclick="finish('Miércoles')">Miércoles</button>
            <button class="day-btn preferred" onclick="finish('Jueves')">Jueves</button>
            <button class="day-btn" onclick="finish('Viernes')">Viernes</button>
            <button class="day-btn" onclick="finish('Sábado')">Sábado</button>
            <button class="day-btn" onclick="finish('Domingo')">Domingo</button>
        </div>
    </div>

    <div id="step3" class="container hidden">
        <img src="foto3.jpg" alt="Hecho" class="event-img">
        <h1>¡Hecho! Nos vemos el <span id="chosen-day"></span> 💚</h1>
        <p>Te escribo luego para concretar sitio y hora.</p>
    </div>

    <script>
        // Manejo del desvanecimiento inicial
        window.addEventListener('load', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                intro.classList.add('fade-out');
                // Quitamos el elemento del flujo después de la animación
                setTimeout(() => {
                    intro.style.display = 'none';
                }, 1500);
            }, 2500); // Se muestra durante 2.5 segundos
        });

        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const chosenDaySpan = document.getElementById('chosen-day');

        function dodgeButton() {
            btnNo.style.position = 'fixed';
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        btnNo.addEventListener('mouseover', dodgeButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeButton();
        });

        btnYes.addEventListener('click', () => {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
        });

        function finish(day) {
            step2.classList.add('hidden');
            step3.classList.remove('hidden');
            chosenDaySpan.textContent = day;
        }
    </script>
</body>
</html>
