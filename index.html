<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tengo una pregunta...</title>
    <style>
        /* Fondo blanco adaptado para iPhone */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff; /* Fondo blanco */
            color: #333;
            text-align: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            max-width: 90%;
            width: 350px;
            background: white;
            padding: 2.5rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* Sombra más neutra */
        }

        .hidden { display: none !important; }

        /* Estilo para las imágenes */
        .event-img {
            max-width: 100%;
            height: auto;
            max-height: 180px; /* Para que no ocupe toda la pantalla del móvil */
            border-radius: 16px;
            margin-bottom: 1.5rem;
            object-fit: cover;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #db2777; 
            line-height: 1.3;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            height: 60px;
            margin-top: 1rem;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .yes {
            background-color: #db2777;
            color: white;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
            z-index: 10;
        }

        .yes:active { transform: scale(0.95); }

        .no {
            background-color: #e5e7eb;
            color: #4b5563;
            z-index: 5;
            transition: top 0.2s ease-out, left 0.2s ease-out;
        }

        .hint {
            font-size: 0.95rem;
            color: #6b7280;
            font-style: italic;
            margin-bottom: 1.5rem;
        }

        .days-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-btn {
            padding: 14px;
            border: 2px solid #db2777;
            background: white;
            color: #db2777;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-btn:active {
            background: #db2777;
            color: white;
        }

        .preferred {
            background-color: #fdf2f8;
            border: 2px solid #be185d;
        }
    </style>
</head>
<body>

    <div id="step1" class="container">
        <img src="foto1.jpg" alt="Pregunta" class="event-img">
        
        <h1>¿Quieres quedar a comer conmigo esta semana?</h1>
        <div class="buttons-wrapper">
            <button id="btn-yes" class="btn yes">¡Sí!</button>
            <button id="btn-no" class="btn no">No</button>
        </div>
    </div>

    <div id="step2" class="container hidden">
        <img src="foto2.jpg" alt="Celebración" class="event-img">

        <h1>¡Genial! 🎉</h1>
        <p>¿Qué día te viene mejor?</p>
        <p class="hint">(P.D: Si te soy sincero, mi preferencia es el miércoles o el jueves 😉)</p>
        <div class="days-grid">
            <button class="day-btn preferred" onclick="finish('Miércoles')">Miércoles</button>
            <button class="day-btn preferred" onclick="finish('Jueves')">Jueves</button>
            <button class="day-btn" onclick="finish('Viernes')">Viernes</button>
            <button class="day-btn" onclick="finish('Sábado')">Sábado</button>
            <button class="day-btn" onclick="finish('Domingo')">Domingo</button>
        </div>
    </div>

    <div id="step3" class="container hidden">
        <img src="foto3.jpg" alt="Plan confirmado" class="event-img">

        <h1>¡Planazo fijado para el <span id="chosen-day"></span>! 🥰</h1>
        <p>Hablamos por WhatsApp para concretar la hora y el sitio.</p>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const chosenDaySpan = document.getElementById('chosen-day');

        function dodgeButton() {
            btnNo.style.position = 'fixed';
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        btnNo.addEventListener('mouseover', dodgeButton);
        btnNo.addEventListener('touchstart', function(e) {
            e.preventDefault();
            dodgeButton();
        });

        btnYes.addEventListener('click', () => {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
        });

        function finish(day) {
            step2.classList.add('hidden');
            step3.classList.remove('hidden');
            chosenDaySpan.textContent = day;
        }
    </script>
</body>
</html>
